name: RLS Policy Safety Check

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**.sql"
      - "scripts/check-rls-policies.mjs"
      - ".github/workflows/rls-policy-check.yml"
  pull_request:
    paths:
      - "supabase/migrations/**.sql"
      - "scripts/check-rls-policies.mjs"
      - ".github/workflows/rls-policy-check.yml"

jobs:
  check-rls:
    name: Scan migrations for unsafe RLS policies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run RLS policy check
        run: node scripts/check-rls-policies.mjs
