  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        var isInIframe = false;
        try { isInIframe = window.self !== window.top; } catch (e) { isInIframe = true; }
        var isPreview = location.hostname.includes('id-preview--') || location.hostname.includes('lovableproject.com');
        if (!isInIframe && !isPreview) {
          window.addEventListener('load', async function () {
            try {
              var reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
              console.log('SW registered:', reg.scope);
              if ('Notification' in window) {
                await Notification.requestPermission();
              }
              if ('periodicSync' in reg) {
                try {
                  await reg.periodicSync.register('sync-civic-data', {
                    minInterval: 24 * 60 * 60 * 1000
                  });
                  console.log('Periodic sync registered');
                  await reg.periodicSync.register('sync-legislation', {
                    minInterval: 12 * 60 * 60 * 1000
                  });
                  await reg.periodicSync.register('sync-elections', {
                    minInterval: 6 * 60 * 60 * 1000
                  });
                } catch (err) {
                  console.log('Periodic sync not supported:', err);
                }
              }
            } catch (err) {
              console.error('SW registration failed:', err);
            }
          });
        } else {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
      }
    </script>
