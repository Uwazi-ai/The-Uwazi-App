    <script>
      if ('serviceWorker' in navigator) {
        var isInIframe = false;
        try { isInIframe = window.self !== window.top; } catch (e) { isInIframe = true; }
        var isPreview = location.hostname.includes('id-preview--') || location.hostname.includes('lovableproject.com');
        if (!isInIframe && !isPreview) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then(function (reg) { console.log('SW registered:', reg.scope); })
              .catch(function (err) { console.error('SW failed:', err); });
          });
        } else {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
      }
    </script>
